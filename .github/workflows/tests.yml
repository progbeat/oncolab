name: Tests
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  release-policy:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.policy.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: policy
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/release_policy.py --base "$BASE"

  python:
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run --locked python -m unittest discover -s tests -v
      - run: uv build

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.release-policy.outputs.version != ''
    needs: [release-policy, python]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: oncolab-release-${{ needs.release-policy.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - run: uv build --no-sources
      - name: Verify the wheel and prepare checksums
        env:
          VERSION: ${{ needs.release-policy.outputs.version }}
        run: |
          wheel="$PWD/dist/oncolab-$VERSION-py3-none-any.whl"
          export UV_TOOL_DIR="$RUNNER_TEMP/oncolab-tools" UV_TOOL_BIN_DIR="$RUNNER_TEMP/oncolab-bin"
          uv tool install "$wheel"
          test "$("$UV_TOOL_BIN_DIR/oncolab" --version)" = "oncolab $VERSION"
          cd dist
          sha256sum -- "oncolab-$VERSION-py3-none-any.whl" "oncolab-$VERSION.tar.gz" > sha256.sum
      - name: Publish this tested version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release-policy.outputs.version }}
        run: bash scripts/publish_release.sh "$VERSION"

  publish-pypi:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.release.result == 'success'
    needs: [release-policy, release]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/oncolab/
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: oncolab-pypi-${{ needs.release-policy.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: Download and verify the immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release-policy.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha)" = "$GITHUB_SHA"
          test "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,isImmutable --jq '.isImmutable and (.isDraft | not)')" = true
          mkdir dist
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern "oncolab-$VERSION-py3-none-any.whl" \
            --pattern "oncolab-$VERSION.tar.gz" --pattern sha256.sum
          cd dist
          sha256sum -- "oncolab-$VERSION-py3-none-any.whl" "oncolab-$VERSION.tar.gz" | cmp - sha256.sum
      - name: Publish distributions to PyPI
        env:
          VERSION: ${{ needs.release-policy.outputs.version }}
        run: |
          uv --no-config publish --trusted-publishing always --check-url https://pypi.org/simple/ \
            "dist/oncolab-$VERSION-py3-none-any.whl" "dist/oncolab-$VERSION.tar.gz"
