[project]
name = "oncolab"
version = "0.1.0"
description = "Run a terminal command on a fresh Google Colab VM."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["prompt-toolkit>=3,<4"]

[project.scripts]
oncolab = "oncolab.cli:main"

[build-system]
requires = ["uv_build>=0.10,<0.15"]
build-backend = "uv_build"
