# Replace these remote names and paths with those in your own rclone config.
# oncolab --config examples/drive.toml -- ls /content/work /mnt/reference

[rclone]
config = "./rclone-colab.conf"

[setup.work]
mount = { source = "gdrive:work", target = "/content/work", readonly = false }

[setup.reference]
mount = { source = "reference:archive", target = "/mnt/reference", readonly = true }

[setup.check-reference]
description = "Checking the reference mount…"
run = 'test -r "$ONCOLAB_MOUNT_REFERENCE"'
needs = ["reference"]
